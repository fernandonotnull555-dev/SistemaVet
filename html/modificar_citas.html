<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Cita</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f9e6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        label {
            margin-bottom: 5px;
            color: #333;
        }

        input[type="datetime-local"], input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #4CAF50;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #388E3C;
        }

        .menu-container {
            margin-top: 20px;
            width: 300px;
            text-align: center;
        }

        .menu-container button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            margin: 5px 0;
            transition: background-color 0.3s;
            width: 100%;
        }

        .menu-container button:hover {
            background-color: #388E3C;
        }
    </style>
</head>
<body>
    <h1>Modificar Cita</h1>

    <div class="form-container">
        <form action="../php/modificar_citas.php" method="POST">
            <label for="id_cita">ID de Cita:</label>
            <input type="text" id="id_cita" name="id_cita" required placeholder="Ingrese el ID de la cita">

            <label for="id_paciente">ID de Paciente:</label>
            <input type="text" id="id_paciente" name="id_paciente" required placeholder="Ingrese el ID del paciente">

            <label for="fecha_cita">Fecha y Hora de Cita:</label>
            <input type="datetime-local" id="fecha_cita" name="fecha_cita" required>

            <label for="motivo">Motivo:</label>
            <input type="text" id="motivo" name="motivo" required placeholder="Ingrese el motivo de la cita">

            <input type="submit" value="Modificar Cita">
        </form>
    </div>

    <div class="menu-container">
        <button onclick="window.location.href='modificar_bd.html'">Regresar </button>
    </div>
</body>
</html>
